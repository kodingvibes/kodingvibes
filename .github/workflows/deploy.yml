name: Deploy

# AGENTS.md says the app "is deployed to Vercel from the `kodingvibes` project;
# releases here are independent of Vercel deploys unless the workflow is
# extended to trigger them." This is that extension.
#
# Why it exists: the Vercel Git integration stopped firing after 2026-07-20 and
# no deployment was created for two months, while main kept receiving commits
# (verifiable via the deployments API). Nothing in CI noticed, because nothing
# in CI deploys. This makes the deploy explicit, versioned and reviewable
# instead of depending on a dashboard toggle nobody is watching.
#
# The Git integration was reconnected on 2026-09-21, so both paths can now
# publish the same commit. This workflow therefore checks first whether the
# commit is already live in production and skips if so — otherwise every push
# to main would produce two production deployments.
#
# ---------------------------------------------------------------------------
# SETUP (one time) — the workflow no-ops until these three repository secrets
# exist, so merging it cannot break anything.
#
# 1. Create a token:  https://vercel.com/account/tokens
# 2. Add the secrets in GitHub -> Settings -> Secrets and variables -> Actions:
#
#      VERCEL_TOKEN       the token from step 1
#      VERCEL_ORG_ID      Vercel -> Team/Account Settings -> General -> ID
#      VERCEL_PROJECT_ID  Vercel -> project `kodingvibes` -> Settings -> General -> Project ID
#
#    or, equivalently, from a checkout that is linked to Vercel:
#      cat .vercel/project.json      # -> orgId / projectId
#
# 3. Run it: push to main, or Actions -> Deploy -> Run workflow.
# ---------------------------------------------------------------------------

on:
  # Only after the CI workflow is green on main, so a broken build is never
  # published. `CI` is the workflow name in ci.yml.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual trigger: needed to make the first deploy after the secrets are added
  # (workflow_run only fires on a new CI completion).
  workflow_dispatch:

concurrency:
  # Never let two production deploys race.
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The commit this run is responsible for. workflow_dispatch has no
  # workflow_run payload, so fall back to the dispatched ref's SHA.
  TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    # For workflow_run, require CI to have succeeded. workflow_dispatch has no
    # workflow_run payload, hence the explicit null check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Deploy the exact commit CI validated, not whatever main points at by
          # the time this job starts.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # A job-level `if` cannot read the secrets context, so the guard is a step
      # that every later step keys off. Without the secrets this workflow goes
      # green-and-idle rather than failing on every push to main.
      - name: Check for Vercel credentials
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy — missing repository secret(s):$missing. Add them and re-run this workflow. See the header of .github/workflows/deploy.yml."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Idempotence guard. The Vercel Git integration usually deploys this same
      # commit within seconds of the push, concurrently with this run. Deploying
      # again would publish a second identical production deployment, so check
      # what is already there and skip when this commit is live.
      - name: Check whether this commit is already deployed
        id: live
        if: steps.creds.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Wait briefly for the Git integration to finish before deciding — it
          # starts before this job and typically completes in under a minute.
          deadline=$((SECONDS + 150))
          while :; do
            json="$(curl -sS --max-time 30 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&limit=20")" || json=""

            # jq is preinstalled on ubuntu-latest runners.
            state="$(printf '%s' "$json" | jq -r --arg sha "$TARGET_SHA" '[ .deployments[]? | select((.meta.githubCommitSha // "") == $sha) | (.readyState // "unknown") ] | first // "absent"' 2>/dev/null || echo unknown)"

            echo "commit ${TARGET_SHA:0:8} in production: $state"
            case "$state" in
              READY)
                echo "already=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              ERROR|CANCELED)
                # A failed attempt must not block the fallback deploy.
                echo "already=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
              BUILDING|QUEUED|INITIALIZING)
                if [ "$SECONDS" -ge "$deadline" ]; then
                  echo "already=false" >> "$GITHUB_OUTPUT"; exit 0
                fi
                sleep 15 ;;
              *)
                # absent, or the API could not be read: deploy.
                echo "already=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          done

      - name: Skip notice
        if: steps.creds.outputs.configured == 'true' && steps.live.outputs.already == 'true'
        run: |
          echo "::notice::The Vercel Git integration already published ${TARGET_SHA:0:8} to production; skipping the duplicate deploy. Use workflow_dispatch if you need this workflow to deploy anyway."

      - name: Setup Node.js
        if: steps.creds.outputs.configured == 'true' && steps.live.outputs.already != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.configured == 'true' && steps.live.outputs.already != 'true'
        run: npm ci

      # `vercel pull` fetches the project settings AND the environment variables
      # configured in the Vercel dashboard, so the production build sees the same
      # NEXT_PUBLIC_* values as a dashboard deploy. Pull, build and deploy must
      # all run with the same working directory: `vercel build` writes .vercel/output
      # and `vercel deploy --prebuilt` uploads it.
      - name: Pull Vercel environment
        if: steps.creds.outputs.configured == 'true' && steps.live.outputs.already != 'true'
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for production
        if: steps.creds.outputs.configured == 'true' && steps.live.outputs.already != 'true'
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to production
        if: steps.creds.outputs.configured == 'true' && steps.live.outputs.already != 'true'
        id: deploy
        run: |
          url="$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Summary
        if: steps.creds.outputs.configured == 'true'
        run: |
          {
            echo "### Production deploy"
            echo ""
            echo "- Commit: \`${TARGET_SHA}\`"
            if [ "${{ steps.live.outputs.already }}" = "true" ]; then
              echo "- Result: **skipped** — the Vercel Git integration already published this commit"
            else
              echo "- Result: deployed by this workflow"
              echo "- Deployment: ${{ steps.deploy.outputs.url }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

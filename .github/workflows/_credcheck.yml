name: Push probe (temporary)

# Desechable. Reproduce la operación exacta que semantic-release necesita:
# un push directo a una rama con la MISMA proteccion que `main`.
# Comprueba cada credencial por separado y no imprime ningun valor de token.
on:
  push:
    branches: [tmp/credcheck]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Try to push with each credential
        env:
          CAND_MOTOKO_PAT: ${{ secrets.MOTOKO_PAT }}
          CAND_GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CAND_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          git config user.name  "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"

          try_push () {
            name="$1"; tok="${2:-}"
            if [ -z "$tok" ]; then
              printf '%-16s ABSENT\n' "$name"; return 0
            fi
            git checkout -q -B probe-base HEAD
            echo "probe $name $(date -u +%s%N)" > .probe_marker
            git add .probe_marker
            git commit -q -m "chore: probe $name [skip ci]"
            url="https://x-access-token:${tok}@github.com/${GITHUB_REPOSITORY}.git"
            if git push -q "$url" HEAD:tmp/credcheck 2>/tmp/pusherr; then
              printf '%-16s PUSH OK  <- este token sirve\n' "$name"
            else
              printf '%-16s PUSH RECHAZADO: %s\n' "$name" "$(head -1 /tmp/pusherr | cut -c1-140)"
            fi
            git checkout -q -B tmp/credcheck "$(git rev-parse HEAD~1)" 2>/dev/null || true
            rm -f .probe_marker
          }

          echo "=== candidatos (push a rama con proteccion igual a main) ==="
          try_push GITHUB_TOKEN "$CAND_GITHUB_TOKEN"
          try_push MOTOKO_PAT   "$CAND_MOTOKO_PAT"
          try_push GH_TOKEN     "$CAND_GH_TOKEN"

name: Lockfile Healer

on:
  workflow_dispatch: # Permite ejecución manual
  schedule:
    - cron: '0 0 * * 0' # Se ejecuta cada domingo a medianoche

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Dependencies
        run: |
          npm install
          npm run lint # Opcional: verificar que el lock no rompa el lint

      - name: Commit and Push changes
        env:
          GH_TOKEN: ${{ secrets.MOTOKO_PAT }}
        run: |
          git config --global user.name "motoko-section9"
          git config --global user.email "madkoding+motoko@gmail.com"
          git add package-lock.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: lockfile healer - synchronize package-lock.json with package.json"
          gh api repos/kodingvibes/kodingvibes/contents/package-lock.json \
            -f message="chore: lockfile healer - synchronize package-lock.json with package.json" \
            -f content="$(base64 -w0 package-lock.json)" \
            -f sha="$(gh api repos/kodingvibes/kodingvibes/contents/package-lock.json --jq '.sha' 2>/dev/null || echo '')"

name: Lockfile Healer

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MOTOKO_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Dependencies
        run: npm install

      - name: Commit and Push changes
        run: |
          git config --global user.name "motoko-section9"
          git config --global user.email "madkoding+motoko@gmail.com"
          git add package-lock.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: lockfile healer - synchronize package-lock.json with package.json"
          git push

name: Release

# semantic-release necesita publicar un commit de release (CHANGELOG.md +
# package.json) directamente en `main`, que está protegida con 1 revisión
# requerida. `enforce_admins: false`, así que un PAT de administrador sí puede.
#
# Dos cosas son necesarias, y omitir la segunda fue el fallo durante dos meses:
#   1. GITHUB_TOKEN en el entorno, que usa @semantic-release/github.
#   2. `token:` en actions/checkout. @semantic-release/git hace
#      `git push --tags <url>` sin credenciales en la URL: se autentica con el
#      `http.extraheader` que checkout escribe en la config del repo. Sin este
#      ajuste ese header lleva el token automático (github-actions[bot]), que NO
#      puede saltarse la protección, y el push muere con GH006 aunque
#      GITHUB_TOKEN esté bien puesto.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT: debe ser de administrador para poder publicar en `main` protegida.
          token: ${{ secrets.GH_TOKEN }}

      # Un `if` a nivel de job no puede leer `secrets`, así que la comprobación es
      # un step. Falla con un mensaje claro en vez del `ENOGHTOKEN` críptico de
      # semantic-release.
      - name: Check for the release token
        env:
          GH_TOKEN_VALUE: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN_VALUE" ]; then
            echo "::error::Falta el secreto GH_TOKEN. Crea un PAT clásico con scope 'repo' en https://github.com/settings/tokens y guárdalo como secreto del repositorio. Debe ser de una cuenta con permiso de administrador sobre el repo, porque publica en 'main' protegida."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          # El mismo PAT: se usa tanto para la API (tags, releases) como para el push.
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

